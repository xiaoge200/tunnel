<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tunnel</title>
        <link rel="stylesheet" href="/src/styles.css" />
        <script type="module" src="/src/main.ts" defer></script>
    </head>
    <body>
        <!-- Mini Widget View -->
        <div id="mini-widget-view" class="widget-container">
            <div class="widget-header" id="widget-header">
                <span class="widget-title">Tunnel</span>
                <div class="widget-controls">
                    <button id="btn-config" class="ctrl-btn" title="配置">
                        ⚙
                    </button>
                    <button id="btn-close" class="ctrl-btn" title="隐藏到托盘">
                        ✕
                    </button>
                </div>
            </div>
            <div class="widget-body" id="widget-body">
                <!-- 每隧道一行,由 MiniWidget 动态生成 -->
                <div id="tunnel-rows" class="tunnel-rows"></div>
            </div>
        </div>

        <!-- Config Panel View -->
        <div id="config-panel-view" class="config-panel" style="display: none">
            <div class="config-header">
                <h2 id="config-title">Tunnel - 配置</h2>
            </div>
            <div class="config-body">
                <div id="tunnel-editor-area"></div>
            </div>
        </div>
    </body>
</html>
