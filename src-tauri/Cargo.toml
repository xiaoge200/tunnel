[package]
name = "Tunnel"
version = "0.1.0"
description = "Tunnel - Database SSH Tunnel Tool"
authors = ["xiaoge"]
edition = "2021"

[lib]
name = "tunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
russh = "0.44"
russh-keys = "0.44"
async-trait = "0.1"
ring = "0.17"
base64 = "0.22"
